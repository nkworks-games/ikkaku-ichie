#title .ruby{color:var(--faint);letter-spacing:.35em;font-size:14px}
#title h1{margin:10px 0 4px;font-size:64px;letter-spacing:.18em;padding-left:.18em;line-height:1.2}
#title .sub{color:var(--sub);font-size:min(16px,4.05vw);letter-spacing:.04em;white-space:nowrap}
.trialtag{margin-top:12px;font-size:12.5px;color:#fff;background:var(--red);border-radius:99px;padding:3px 12px;letter-spacing:.08em}
.howto{margin:22px 0 0;background:rgba(251,247,236,.82);border-radius:16px;padding:16px 20px;color:var(--sub);font-size:14.5px;line-height:1.95;width:100%;max-width:360px}
.howto b{font-weight:400;color:var(--ink)}
.pill{display:block;width:100%;max-width:300px;border-radius:99px;padding:15px 0;font-size:19px;letter-spacing:.12em;text-align:center;color:#fff;text-decoration:none}
.pill.navy{background:var(--navy)}
.pill.red{background:var(--red)}
.pill.slate{background:var(--slate);font-size:15px;padding:12px 0}
.pill.ghost{color:var(--navy);border:1px solid var(--navy);background:rgba(251,247,236,.7);font-size:15px;padding:12px 0}
#title .pill+.pill,#title .note+.pill{margin-top:12px}
#title .note{margin-top:10px;font-size:12px;color:var(--faint);text-align:center;line-height:1.6}
#title .brand{margin-top:14px;font-size:12px;color:var(--faint);text-decoration:none}

/* ---------- header ---------- */
#hud{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
#stageBtn{position:relative;height:40px;padding:0 26px 0 14px;color:#fff;font-size:16px;letter-spacing:.06em;
  background:var(--navy);border-radius:6px 14px 10px 4px;white-space:nowrap}
#stageBtn::after{content:"▾";position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.85}
#prog{flex:1;min-width:0;line-height:1.25}
#prog .n{font-size:19px;white-space:nowrap}
#prog .st{color:var(--gold);letter-spacing:.04em;font-size:17px}
#prog .om{font-size:12px;color:var(--faint);white-space:nowrap}
.ic{width:42px;height:42px;border-radius:50%;background:rgba(251,247,236,.9);display:grid;place-items:center;flex:none}
.ic svg{width:22px;height:22px;stroke:var(--navy);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- strip ---------- */
#strip{display:flex;gap:6px;overflow-x:auto;padding:4px 12px 8px;scrollbar-width:none;touch-action:pan-x;flex:none}
#strip::-webkit-scrollbar{display:none}
.chip{flex:none;width:52px;height:62px;border-radius:9px;border:1px solid var(--line);background:var(--paper);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.chip .g{font-size:30px}
.chip .r{font-size:10px;color:var(--faint);margin-top:4px;white-space:nowrap}
.chip.veil{border:1.5px dashed #b9b1a1;background:rgba(251,247,236,.45);color:#9a9384}
.chip.veil .g{font-size:20px;font-family:inherit}
.chip.bonus{background:var(--bonus)}
.chip.pop{animation:pop .45s}

/* ---------- board ---------- */
#boardWrap{flex:1;min-height:0;display:flex;padding:2px 14px 6px}
#board{position:relative;flex:1;border-radius:14px;background:rgba(251,247,236,.88);box-shadow:0 0 0 1px rgba(207,199,183,.55) inset;overflow:visible}
#board .empty{position:absolute;inset:0;display:grid;place-items:center;color:#aaa395;font-size:14px;letter-spacing:.1em;text-align:center;line-height:1.9;pointer-events:none}
.piece{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font-size:calc(var(--u)*300);line-height:1;
  width:1.1em;height:1.1em;display:grid;place-items:center;transition:opacity .25s}
.piece.pop{animation:pop .3s}
.piece.drag{opacity:.45}
.gst{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font-size:calc(var(--u)*300);line-height:1;pointer-events:none;color:var(--ink)}
.burst{position:absolute;width:10px;height:10px;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%)}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(1)}40%{transform:translate(-50%,-50%) scale(1.14)}100%{transform:translate(-50%,-50%) scale(1)}}
.chip.pop{animation:popc .45s}
@keyframes popc{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{margin-left:0}25%{margin-left:-6px}75%{margin-left:6px}}
.piece.shake{animation:shake .25s}

/* ---------- tray ---------- */
#tray{flex:none;display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:8px;padding:6px 14px;touch-action:none}
.cell{position:relative;aspect-ratio:1/0.82;border-radius:12px;border:1px solid var(--line);background:var(--paper);
  display:grid;place-items:center;font-size:calc(var(--W) * var(--cf,.1));line-height:1;touch-action:none;cursor:grab}
.cell.found{background:var(--found)}
.cell.bonus{background:var(--bonus)}
.cell.new{animation:popc .45s}
.cell .lab{position:absolute;top:5px;font-size:10.5px;color:var(--sub);line-height:1.05;font-family:"NotoL",sans-serif;writing-mode:vertical-rl}
.cell .lab.on{right:6px}.cell .lab.kun{left:6px}

/* ---------- bottom ---------- */
#bottom{display:flex;gap:10px;padding:8px 14px 10px}
#bottom button{height:50px;border-radius:99px;color:#fff;font-size:17px;letter-spacing:.12em}
#undoBtn{flex:1.6;background:var(--navy)}
#clearBtn{flex:1;background:var(--slate)}

/* ---------- floating drag ---------- */
#drag{position:fixed;left:0;top:0;z-index:50;pointer-events:none;transform:translate(-50%,-50%);
  font-size:calc(var(--u)*260);line-height:1;opacity:.9;color:var(--ink);text-shadow:0 2px 8px rgba(0,0,0,.08)}

/* ---------- toast ---------- */
#toasts{position:absolute;left:0;right:0;z-index:40;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 18px}
.toast{max-width:100%;background:rgba(40,44,52,.88);color:#fff;font-size:14.5px;line-height:1.6;border-radius:12px;padding:10px 16px;white-space:pre-line;text-align:center;
  animation:tin .25s ease-out;transition:opacity .3s}
.toast.gold{background:rgba(120,92,30,.92)}
.toast .k{font-size:1.15em}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- modal ---------- */
.modal{position:absolute;inset:0;z-index:60;background:rgba(30,28,24,.38);display:grid;place-items:center;padding:20px;touch-action:pan-y}
.sheet{touch-action:pan-y;position:relative;width:100%;max-width:400px;max-height:88%;overflow-y:auto;background:var(--paper);border-radius:18px;padding:24px 22px 20px;box-shadow:0 10px 40px rgba(0,0,0,.18)}
.close{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;background:#eee6d6;font-size:20px;color:var(--sub)}
.sheet h2{margin:0 0 10px;font-weight:400;font-size:22px;letter-spacing:.06em}
.sheet p{margin:0 0 14px;color:var(--sub);font-size:15px;line-height:1.85;white-space:pre-line}
.sheet .pill{margin:10px auto 0}
.cardTop{display:flex;align-items:center;gap:18px;margin:4px 0 14px}
.cardTop .big{font-size:104px;line-height:1}
.yomi{font-size:13px;color:var(--faint);line-height:2}
.yomi span{color:var(--ink);font-size:17px;margin-left:10px}
.lbl{font-size:12px;color:var(--faint);margin-top:12px}
.val{font-size:16px;line-height:1.7}
.val small{color:var(--faint);font-size:13.5px}
.hintBody{font-size:15.5px;line-height:2.1;white-space:pre-line;margin:6px 0 4px}
.stRow{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;background:#fffdf7}
.stRow b{font-weight:400;font-size:16px}
.stRow .s{display:block;font-size:13px;color:var(--faint);margin-top:2px}
.stRow.cur{border-color:var(--navy)}
.stRow.lock{opacity:.55}
.appBox{margin-top:14px;border-radius:14px;background:#f1e9d6;padding:14px;font-size:14px;line-height:1.8;color:var(--sub)}
.appBox .row{display:flex;gap:12px;align-items:center}
.appBox img{width:56px;height:56px;border-radius:13px;flex:none}
.appBox b{font-weight:400;color:var(--ink);font-size:16px}
.menuRow{display:flex;justify-content:space-between;align-items:center;padding:13px 2px;border-bottom:1px solid #e6dfcf;font-size:16px}
.menuRow:last-child{border-bottom:0}
.sw{width:52px;height:30px;border-radius:99px;background:#cfc7b7;position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:var(--navy)}.sw.on::after{left:25px}
a.menuRow{color:var(--navy);text-decoration:none}

/* ---------- tutorial hand ---------- */
#hand{position:absolute;z-index:45;width:44px;height:44px;pointer-events:none;opacity:0}
#hand.run{animation:hand 2.2s ease-in-out infinite}
#tutMsg{position:absolute;z-index:45;left:0;right:0;text-align:center;pointer-events:none;font-size:15px;color:var(--navy);letter-spacing:.06em}
</style>
</head>

const RULES = DATA.rules;               // [A, dir, B, result, reading, aForm, bForm]
const RIDX = new Map();
for (const r of RULES) { const k = r[0] + "|" + r[1] + "|" + r[2]; if (!RIDX.has(k)) RIDX.set(k, r); }
const lookup = (a, d, b) => RIDX.get(a + "|" + d + "|" + b) || null;
// rel は「置いてある字（slot）から見て、持ってきた字（drag）がどこにあるか」
function resolve(slot, drag, rel) {
  switch (rel) {
    case "R": return lookup(slot, "LR", drag);
    case "L": return lookup(drag, "LR", slot);
    case "A": return lookup(drag, "TB", slot);
    case "B": return lookup(slot, "TB", drag);
    case "I": return lookup(slot, "ENC", drag) || lookup(drag, "ENC", slot);
  }
  return null;
}
const OIDX = new Map();
for (const o of DATA.outside) { const k = o[0] + "|" + o[1] + "|" + o[2]; if (!OIDX.has(k)) OIDX.set(k, o[3]); }
function outside(slot, drag, rel) {   // undefined = 字にならない / "" = 字はあるが名前は出さない / "X"
  const g = (a, d, b) => OIDX.get(a + "|" + d + "|" + b);
  switch (rel) {
    case "R": return g(slot, "LR", drag);
    case "L": return g(drag, "LR", slot);
    case "A": return g(drag, "TB", slot);
    case "B": return g(slot, "TB", drag);
    case "I": { const v = g(slot, "ENC", drag); return v !== undefined ? v : g(drag, "ENC", slot); }
  }
}
const GROUPS = [["士", "土"], ["未", "末"]];
const groupOf = g => GROUPS.find(x => x.includes(g)) || [g];
const canon = g => groupOf(g)[0];
const LABELS = { "士": ["シ", 1], "土": ["つち", 0], "未": ["ミ", 1], "末": ["すえ", 0] };
function readingOf(g) {
  for (const r of RULES) if (r[3] === g) return r[4];
  return DATA.alt[g] || "";
}
function recipeFor(g, avail) {
  const c = canon(g);
  for (const r of RULES) if ((r[3] === g || r[3] === c) && avail.has(r[0]) && avail.has(r[2])) return r;
  for (const r of RULES) if (r[3] === g || r[3] === c) return r;
  return null;
}

const STAGES = [
  { key: "s01", id: 1, name: "ふたつで、ひとつ", want: "囲む", sample: "回困囚",

  { key: "s02", id: 2, name: "ひと筆、たす", want: "同じふたつ", sample: "二昌昍",
    parts: ["口", "木", "人", "一"], targets: ["日", "大", "二", "本", "三", "天", "体", "味", "末", "未", "唱", "因", "昌", "昍"] },
];
for (const s of STAGES) {
  const n = s.targets.length;
  s.star = [Math.ceil(n * 0.3), Math.ceil(n * 0.7), n];
  // そのステージで作れる字ぜんぶ（ゲームと同じ手順で広げる）
  const have = new Set(s.parts); let ch = true;
  while (ch) { ch = false;
    for (const r of RULES) { if (have.has(r[3])) continue;
      if (have.has(r[0]) && have.has(r[2])) { for (const m of groupOf(r[3])) have.add(m); ch = true; } } }
  for (const p of s.parts) have.delete(p);
  s.reach = have;
  s.hiddenTotal = [...have].filter(g => !s.targets.includes(g)).length;
}

function stOf(s) {

function madeSet() { const m = new Set(stage.parts); for (const g of ST.f) m.add(g); for (const g of ST.h) m.add(g); return m; }
function obtainable() { const o = new Set(stage.parts); for (const g of stage.reach) o.add(g); return o; }
function stillUseful(g, made, obt) {
  for (const r of RULES) {
    if (r[0] !== g && r[2] !== g) continue;
    if (made.has(r[3])) continue;
    const other = r[0] === g ? r[2] : r[0];
    if (!obt.has(other)) continue;
    return true;
  }
  return false;
}
function boardUsable(g) {
  if (stage.parts.includes(g)) return true;
  return stillUseful(g, madeSet(), obtainable());
}

// ================= 面に入る =================
function enterStage(i) {
  stage = STAGES[i]; S.cur = i; ST = stOf(stage);
  // 前の面で作った字は、最初から手元にある扱いにする（作り直しは作業になるため）
  const known = new Set();
  for (const s of STAGES) { if (s === stage) continue; const t = stOf(s); t.f.forEach(g => known.add(g)); t.h.forEach(g => known.add(g)); }
  for (const g of stage.reach) {
    if (!known.has(g)) continue;
    if (stage.targets.includes(g)) { if (!ST.f.includes(g)) ST.f.push(g); }
    else if (!ST.h.includes(g)) ST.h.push(g);
  }
  ST.stars = Math.max(ST.stars, starsFor(stage));
  pieces.forEach(p => p.el.remove()); pieces = []; history = [];
  clearGhost();
  document.getElementById("stageBtn").textContent = "STAGE " + stage.id;
  buildTray(); buildStrip(); hud(); refreshEmpty();
  save();
}

function shortRead(g) {
  if (LABELS[g]) return LABELS[g][0];
  const r = readingOf(g); if (!r) return "";
  const parts = r.split("・");
  let best = parts[0]; for (const p of parts) if (p.length < best.length) best = p;
  return best.replace(/（.*?）/g, "");
}
function buildStrip(popG) {
  stripEl.innerHTML = "";
  const add = (g, cls, veil) => {
    const c = document.createElement("div");
    c.className = "chip " + cls + (g === popG ? " pop" : "");
    if (veil) c.innerHTML = '<span class="g">□</span>';
    else { c.innerHTML = '<span class="g k"></span><span class="r"></span>'; c.firstChild.textContent = g; c.lastChild.textContent = shortRead(g);
      c.addEventListener("click", () => openCard(g)); }
    stripEl.appendChild(c);
    if (g === popG) setTimeout(() => c.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" }), 30);
  };
  for (const g of stage.targets) add(g, ST.f.includes(g) ? "" : "veil", !ST.f.includes(g));
  for (const g of ST.h) add(g, "bonus", false);
}

function trayList() {

}

    c.textContent = g; c.dataset.g = g;
    if (LABELS[g]) { const l = document.createElement("span"); l.className = "lab " + (LABELS[g][1] ? "on" : "kun"); l.textContent = LABELS[g][0]; c.appendChild(l); }
    c.addEventListener("pointerdown", e => startDragFromTray(e, g, c));

// ================= 盤 =================
function refreshEmpty() { document.getElementById("empty").classList.toggle("hide", pieces.length > 0); }
function mkPiece(g, x, y) {
  const el = document.createElement("div");
  el.className = "piece k"; el.textContent = g;
  board.appendChild(el);
  const p = { g, x, y, el };
  el.addEventListener("pointerdown", e => startDragFromBoard(e, p));
  place(p); return p;
}
function place(p) { p.el.style.left = p.x + "px"; p.el.style.top = p.y + "px"; p.el.textContent = p.g; }
function clampToFrame(x, y) {
  const m = 150 * U, w = board.clientWidth, h = board.clientHeight;
  return [Math.max(m, Math.min(w - m, x)), Math.max(m, Math.min(h - m, y))];
}
function inFrame(x, y) { return x >= 0 && y >= 0 && x <= board.clientWidth && y <= board.clientHeight; }
function inArea(x, y) { const pad = 24; return x >= -pad && y >= -pad && x <= board.clientWidth + pad && y <= board.clientHeight + pad; }
function keepApart(x, y, ignore) {
  for (const p of pieces) {
    if (p === ignore) continue;
    let dx = x - p.x, dy = y - p.y, d = Math.hypot(dx, dy), need = APART * U;
    if (d < 1) { dx = need; dy = 0; d = need; }
    if (d < need) { x = p.x + dx / d * need; y = p.y + dy / d * need; }
  }
  return clampToFrame(x, y);
}
function snapshot() { return pieces.map(p => ({ g: p.g, x: p.x, y: p.y })); }
function pushHistory() { history.push(snapshot()); if (history.length > 30) history.shift(); }
function restore(snap) {
  pieces.forEach(p => p.el.remove());
  pieces = snap.map(s => mkPiece(s.g, s.x, s.y));
  refreshEmpty();
}

// ---- 置き方の読み取り ----
let lastDir = null, lastInside = false;
const CENTER = { R: 0, A: 90, L: 180, B: -90 };
const angDiff = (a, b) => { let d = ((a - b) % 360 + 540) % 360 - 180; return Math.abs(d); };
function direction(px, py, x, y) {
  const vx = x - px, vy = -(y - py);           // 画面は下向きが +y。上を + にそろえる
  if (vx * vx + vy * vy < 1) return null;
  const ang = Math.atan2(vy, vx) * 180 / Math.PI;
  if (lastDir && angDiff(ang, CENTER[lastDir]) <= 45 + HOLD) return lastDir;
  for (const w of ["R", "A", "L", "B"]) if (angDiff(ang, CENTER[w]) <= 45) return w;
  return "R";
}
function nearest(x, y, ignore) {
  let best = null, bd = Infinity;
  for (const p of pieces) { if (p === ignore) continue; const d = Math.hypot(x - p.x, y - p.y); if (d < bd) { bd = d; best = p; } }
  return best && bd <= SNAP * U ? best : null;
}
// その札に対して、いまの位置がどういう置き方になるか。「かさねる」は囲む決まりがあるときだけ採る
function readRel(p, x, y, g) {
  const dist = Math.hypot(x - p.x, y - p.y);
  if (dist > SNAP * U) return null;
  const line = (lastInside ? EXIT : ENTER) * U;
  if (dist < line) {
    const enc = resolve(p.g, g, "I");
    if (enc) { lastInside = true; return { rule: enc, rel: "I" }; }
  }
  lastInside = false;
  let dir;
  if (dist < NODIR * U && lastDir) dir = lastDir;
  else dir = direction(p.x, p.y, x, y);
  if (!dir) dir = lastDir || "B";
  lastDir = dir;
  return { rule: resolve(p.g, g, dir), rel: dir };
}

// ---- 出来上がりを薄く見せる ----
let ghostEl = null, hiddenPiece = null;
function clearGhost() {
  if (hiddenPiece) { hiddenPiece.el.style.visibility = ""; hiddenPiece = null; }
  if (ghostEl) ghostEl.style.display = "none";
}
function showGhost(g, x, y, a) {
  if (!ghostEl) { ghostEl = document.createElement("div"); ghostEl.className = "gst k"; board.appendChild(ghostEl); }
  ghostEl.style.display = ""; ghostEl.textContent = g; ghostEl.style.opacity = a;
  ghostEl.style.left = x + "px"; ghostEl.style.top = y + "px";
}
function preview(x, y, g, moving) {
  if (hiddenPiece) { hiddenPiece.el.style.visibility = ""; hiddenPiece = null; }
  const p = nearest(x, y, moving);
  if (p) {
    const rd = readRel(p, x, y, g);
    if (rd && rd.rule) { hiddenPiece = p; p.el.style.visibility = "hidden"; showGhost(rd.rule[3], p.x, p.y, .42); return; }
  } else { lastDir = null; lastInside = false; }
  const used = pieces.length - (moving ? 1 : 0);
  if (!moving && used < 2 && inFrame(x, y)) { const k = keepApart(x, y, null); showGhost(g, k[0], k[1], .3); return; }
  if (ghostEl) ghostEl.style.display = "none";
}

// ================= ドラッグ =================
const dragEl = document.getElementById("drag");
let D = null;   // {g, from:'tray'|'board', piece, sx, sy, moved, src}
function boardXY(cx, cy) { const r = board.getBoundingClientRect(); return [cx - r.left, cy - r.top]; }
function liftOf(e) { return e.pointerType === "touch" ? 34 : 0; }
function startDragFromTray(e, g, cell) {
  if (D || modalOpen()) return;
  e.preventDefault();
  D = { g, from: "tray", sx: e.clientX, sy: e.clientY, moved: false, lift: liftOf(e), id: e.pointerId, cell };
  audioUnlock();
}
function startDragFromBoard(e, p) {
  if (D || modalOpen()) return;
  e.preventDefault(); e.stopPropagation();
  const [bx, by] = boardXY(e.clientX, e.clientY);
  D = { g: p.g, from: "board", piece: p, sx: e.clientX, sy: e.clientY, moved: false, lift: 0, id: e.pointerId, ox: p.x - bx, oy: p.y - by };

}
window.addEventListener("pointermove", e => {

function endDrag(e, cancel) {

    return;
  }
  if (d.from === "tray") {

  } else {

}

window.addEventListener("pointercancel", e => endDrag(e, true));

function dropFromTray(x, y, g) {
  const p = nearest(x, y, null);
  const rd = p ? readRel(p, x, y, g) : null;
  clearGhost(); lastDir = null; lastInside = false;
  if (rd && rd.rule) {
    pushHistory();
    p.g = rd.rule[3]; place(p); popPiece(p);
    onFuse(rd.rule, p);
    return;
  }
  let rel = rd ? rd.rel : null;
  if (rd && !rd.rule && Math.hypot(x - p.x, y - p.y) < ENTER * U) {
    if (outside(p.g, g, rel) === undefined && outside(p.g, g, "I") !== undefined) rel = "I";
  }
  if (pieces.length < 2 && inFrame(x, y)) {
    pushHistory();
    const k = keepApart(x, y, null);
    const np = mkPiece(g, k[0], k[1]); pieces.push(np); popPiece(np);
    refreshEmpty(); sfx("place"); onPlaced();
    if (rd) onFail(p.g, g, rel, true);
    return;
  }
  if (pieces.length >= 2 && inFrame(x, y)) {
    if (p) shakePiece(p);
    sfx("fail");
    toast("枠に置けるのは ふたつまで。\nどちらかを 枠の外へ 出してね");
  }
}
function dropOnBoard(p, snap, cancel) {
  clearGhost();
  if (cancel) { restore(snap); lastDir = null; lastInside = false; return; }
  const other = nearest(p.x, p.y, p);
  const rd = other ? readRel(other, p.x, p.y, p.g) : null;
  lastDir = null; lastInside = false;
  if (!inArea(p.x, p.y)) {        // 枠の外へ持ち出して離した＝盤から下ろす（置き場には残っている）
    history.push(snap); if (history.length > 30) history.shift();
    pieces = pieces.filter(q => q !== p); p.el.remove(); refreshEmpty(); sfx("undo");
    return;
  }
  if (rd && rd.rule) {
    history.push(snap); if (history.length > 30) history.shift();
    pieces = pieces.filter(q => q !== p); p.el.remove();
    other.g = rd.rule[3]; place(other); popPiece(other);
    onFuse(rd.rule, other);
    return;
  }
  const k = keepApart(p.x, p.y, p); p.x = k[0]; p.y = k[1]; place(p);
  history.push(snap); if (history.length > 30) history.shift();
}
function popPiece(p) { p.el.classList.remove("pop"); void p.el.offsetWidth; p.el.classList.add("pop"); }
function shakePiece(p) { p.el.classList.remove("shake"); void p.el.offsetWidth; p.el.classList.add("shake"); }

// 行き止まりの字は、ひと呼吸だけ見せてから盤から下ろす
function dropDeadEnds() {

}

// ================= 発見 =================
function formNote(r) {
  const one = (part, form, dir, first) => {
    if (!form || form === part) return "";
    const key = part + ">" + form; S.told.forms = S.told.forms || [];
    if (S.told.forms.includes(key)) return ""; S.told.forms.push(key);
    const where = dir === "LR" ? (first ? "左がわ" : "右がわ") : dir === "TB" ? (first ? "上" : "下") : "外がわ";
    return "\n「" + part + "」は " + where + "に来ると 「" + form + "」 のかたちに変わるよ";
  };
  return one(r[0], r[5], r[1], true) || one(r[2], r[6], r[1], false);
}
function onPlaced() { if (!S.tut) { S.tut = true; save(); hideTutorial(true); } }
function onFuse(rule, at) {
  onPlaced();
  const newT = [], newH = [];
  for (const g of groupOf(rule[3])) {
    if (stage.parts.includes(g)) continue;
    if (stage.targets.includes(g)) { if (!ST.f.includes(g)) { ST.f.push(g); newT.push(g); } }
    else if (!ST.h.includes(g)) { ST.h.push(g); newH.push(g); }
  }
  const n = newT.length + newH.length;
  dropDeadEnds();
  if (!n) { sfx("fuse"); return; }
  burst(at, newH.length && !newT.length ? "#c9962e" : "#1e1e20", 10 + n * 4);
  const all = newT.concat(newH);
  buildTray(all); buildStrip(all[0]);
  if (n > 1) {
    sfx("discover");
    toast("同時発見！「" + all.join("」と「") + "」\n形は同じ、横棒の長さが違う字", true);
  } else if (newT.length) {
    sfx("discover");
    let msg = "発見！「" + newT[0] + "」 " + readingOf(newT[0]);
    if (!S.told.grow && boardUsable(newT[0])) { S.told.grow = true; msg += "\nこの字も 置き場から 部品として使えるよ"; }
    toast(msg + formNote(rule));
  } else {
    sfx("hidden");
    toast("おまけの字！「" + newH[0] + "」 " + readingOf(newH[0]) + formNote(rule), true);
  }
  if (!S.told.card && S.told.grow) { S.told.card = true; toast("字を タップすると 読みや いみが 見られるよ"); }
  if (S.hint[stage.key] && all.includes(S.hint[stage.key].t)) delete S.hint[stage.key];
  checkWant();
  if (newT.length) checkStars();
  hud(); save();
}
function onFail(slotG, dragG, rel, placed) {
  if (!placed) sfx("fail");
  for (const alt of groupOf(dragG)) if (alt !== dragG && resolve(slotG, alt, rel)) { toast("おしい！　持ってきたのは「" + dragG + "」…「" + alt + "」なら合いそう"); return; }
  for (const alt of groupOf(slotG)) if (alt !== slotG && resolve(alt, dragG, rel)) { toast("おしい！　置いてあるのは「" + slotG + "」…「" + alt + "」なら合いそう"); return; }
  const o = outside(slotG, dragG, rel);
  if (o !== undefined) {
    if (o) toast("「" + o + "」だ！　いいところに気づいたね\nでも この体験版の図鑑には入っていないんだ", true);
    else toast("その形の字はあるみたい。\nでも この体験版の図鑑には入っていないんだ");
    return;
  }
  for (const p of ["R", "L", "A", "B", "I"]) {
    if (p === rel) continue;
    if (resolve(slotG, dragG, p)) { toast("この置き方では 字にならないみたい\n上下・左右・かさねる を変えてみて"); return; }
  }

}
function checkWant() {

  if (!done) return;

}

function pickHint() {
  const have = new Set(trayList().map(x => x[0]));
  const un = stage.targets.filter(g => !ST.f.includes(g));
  if (un.length) {
    const ready = un.find(g => { const r = recipeFor(g, have); return r && have.has(r[0]) && have.has(r[2]); });
    return { t: ready || un[0], l: 0, bonus: false };
  }
  const rest = [...stage.reach].filter(g => !stage.targets.includes(g) && !ST.h.includes(g)).sort();
  return rest.length ? { t: rest[0], l: 0, bonus: true } : null;
}
function renderHint() {
  const h = S.hint[stage.key];
  if (!h) { openModal('<h2>ヒント</h2><p>この面は おまけの字まで 全部見つけた！\nヒントの出番はもう無いみたい。</p>'); return; }
  const r = recipeFor(h.t, obtainable());
  const dn = r[1] === "LR" ? "左右" : r[1] === "TB" ? "上下" : "囲む";
  const q = "？？？";
  let s3 = "答えは「" + h.t + "」（" + readingOf(h.t) + "）";
  if (groupOf(h.t).length > 1) s3 += "\n　※同じ形の字がもう1つ同時に出る";
  const body = (h.bonus ? "お題はぜんぶ見つけた。ここからは おまけの字——\n\n" : "未発見の字、そのひとつ——\n\n")
    + "①  " + (h.l >= 1 ? "この字は【" + dn + "】の組み合わせ" : q) + "\n"
    + "②  " + (h.l >= 2 ? "パーツの片方は「" + r[0] + "」" : q) + "\n"
    + "③  " + (h.l >= 3 ? s3 : q);
  openModal('<h2>ヒント</h2><div class="hintBody">' + esc(body) + '</div>'
    + (h.l < 3 ? '<button class="pill navy" data-reveal>' + (h.l === 0 ? "手がかりを見る" : "つぎを開く") + '</button>' : '<p style="text-align:center;margin-top:10px">全部開示ずみ</p>')
    + '<p style="font-size:12.5px;color:var(--faint);margin-top:14px;text-align:center">体験版では ヒントは ぜんぶ無料です</p>');
}
document.getElementById("hintBtn").addEventListener("click", () => {
  audioUnlock();
  const h = S.hint[stage.key];
  const done = h && (stage.targets.includes(h.t) ? ST.f.includes(h.t) : ST.h.includes(h.t));
  if (!h || done) { const p = pickHint(); if (p) S.hint[stage.key] = p; else delete S.hint[stage.key]; save(); }
  renderHint();
});

const hand = document.getElementById("hand"), tutMsg = document.getElementById("tutMsg");
function showTutorial() {
  if (S.tut) return;
  const cell = trayEl.querySelector(".cell"); if (!cell) return;
  const ar = app.getBoundingClientRect(), cr = cell.getBoundingClientRect(), br = board.getBoundingClientRect();
  const x0 = cr.left - ar.left + cr.width * .5, y0 = cr.top - ar.top + cr.height * .45;
  const x1 = br.left - ar.left + br.width * .5, y1 = br.top - ar.top + br.height * .5;
  hand.style.left = (x0 - 14) + "px"; hand.style.top = (y0 - 12) + "px";
  hand.animate([{ transform: "translate(0,0)", opacity: 0 }, { transform: "translate(0,0)", opacity: 1, offset: .15 },
                { transform: `translate(${x1 - x0}px,${y1 - y0}px)`, opacity: 1, offset: .75 },
                { transform: `translate(${x1 - x0}px,${y1 - y0}px)`, opacity: 0 }], { duration: 2200, iterations: Infinity, easing: "ease-in-out" });
  tutMsg.style.top = (br.top - ar.top + br.height * .5 + 120 * U + 30) + "px";
  tutMsg.classList.remove("hide");
  document.getElementById("empty").style.opacity = "0";
}
function hideTutorial(done) {
  if (!done && !S.tut) { hand.style.visibility = "hidden"; return; }
  hand.getAnimations().forEach(a => a.cancel()); hand.style.opacity = 0; hand.style.visibility = "hidden";
  tutMsg.classList.add("hide"); document.getElementById("empty").style.opacity = "";
}

// ================= 音 =================
let AC = null; const BANK = {};
function audioUnlock() {
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); buildSfx(); } catch (e) { AC = null; }
  }
  if (AC && AC.state === "suspended") AC.resume();
  bgmApply();
}
function rng(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
function buildSfx() {
  const SR = AC.sampleRate;
  const New = sec => new Float32Array(Math.ceil(sec * SR));
  const Mode = (d, at, f, amp, decay, attack) => {
    const s = Math.floor(at * SR); if (s >= d.length || f <= 0 || f >= SR * .45) return;
    const k = 6.9078 / Math.max(.001, decay), w = 2 * Math.PI * f / SR, aN = Math.max(1, Math.ceil(attack * SR));
    for (let i = s; i < d.length; i++) { const j = i - s; let env = Math.exp(-(j / SR) * k); if (env < .0003) break; if (j < aN) env *= j / aN; d[i] += Math.sin(w * j) * env * amp; }
  };
  const Strike = (d, at, dur, amp, lo, hi, rnd) => {
    const s = Math.floor(at * SR), n = Math.ceil(dur * SR); if (s >= d.length || n <= 0) return;
    const aLp = Math.exp(-2 * Math.PI * hi / SR), aHp = Math.exp(-2 * Math.PI * lo / SR);
    let lp = 0, prev = 0, hp = 0;
    for (let i = 0; i < n; i++) { const k = s + i; if (k >= d.length) break; const wh = rnd() * 2 - 1;
      lp = lp * aLp + wh * (1 - aLp); hp = aHp * (hp + lp - prev); prev = lp;
      let env = Math.pow(1 - i / n, 2.2); if (i < 24) env *= i / 24; d[k] += hp * env * amp; }
  };
  const Rin = (d, at, f0, amp, len) => {
    Mode(d, at, f0, 1 * amp, len, .004); Mode(d, at, f0 * 1.0007, .45 * amp, len, .004);
    Mode(d, at, f0 * 2.32, .55 * amp, len * .62, .004); Mode(d, at, f0 * 3.851, .28 * amp, len * .36, .003); Mode(d, at, f0 * 5.096, .13 * amp, len * .2, .003);
  };
  const Fin = (d, peak) => {
    const fade = Math.min(220, d.length / 8 | 0); for (let i = 0; i < fade; i++) d[d.length - 1 - i] *= i / fade;
    let m = 0; for (const v of d) m = Math.max(m, Math.abs(v)); if (m > 1e-6) for (let i = 0; i < d.length; i++) d[i] *= peak / m;
    const b = AC.createBuffer(1, d.length, SR); b.copyToChannel(d, 0); return b;
  };
  let d, r;
  d = New(.11); r = rng(11); Strike(d, 0, .010, .55, 1400, 5200, r); Mode(d, 0, 1180, .6, .055, .0015); Mode(d, 0, 2670, .24, .028, .0015); Mode(d, 0, 620, .18, .04, .002); BANK.place = Fin(d, .34);
  d = New(.20); r = rng(22); Strike(d, 0, .008, .6, 2200, 7000, r); Mode(d, 0, 1560, .6, .095, .0012); Mode(d, 0, 3180, .3, .05, .0012); Mode(d, 0, 4900, .14, .026, .0012); Mode(d, 0, 240, .22, .06, .003); BANK.fuse = Fin(d, .46);
  d = New(1.05); r = rng(33); Strike(d, 0, .004, .16, 3000, 9000, r); Rin(d, 0, 1046.5, .55, .92); BANK.discover = Fin(d, .68);
  d = New(1.25); r = rng(44); Strike(d, 0, .004, .14, 3000, 9000, r); Rin(d, 0, 1046.5, .4, .55); Rin(d, .105, 1567.98, .5, 1); BANK.hidden = Fin(d, .74);
  d = New(.14); r = rng(55); Strike(d, 0, .018, .4, 120, 780, r); Mode(d, 0, 186, .55, .085, .004); Mode(d, 0, 305, .18, .05, .004); BANK.fail = Fin(d, .24);
  d = New(1.55); r = rng(66); Strike(d, 0, .004, .12, 3000, 9000, r); Rin(d, 0, 1046.5, .34, .45); Rin(d, .13, 1174.7, .38, .5); Rin(d, .26, 1396.9, .55, 1.2); BANK.star = Fin(d, .84);
  d = New(.15); r = rng(77); for (let i = 0; i < 10; i++) { const t = i / 10; Strike(d, t * .085, .02, .22 * (1 - t * .6), 900 + (420 - 900) * t, 3400 + (1500 - 3400) * t, r); } BANK.undo = Fin(d, .2);
}
const WOB = { place: .035, fuse: .022, fail: .03, undo: .03 };
function sfx(n) {
  if (!S.se || !AC || !BANK[n]) return;
  const src = AC.createBufferSource(), g = AC.createGain();
  src.buffer = BANK[n]; const w = WOB[n] || 0; src.playbackRate.value = 1 + (Math.random() * 2 - 1) * w;
  g.gain.value = .5 * (.94 + Math.random() * .06); src.connect(g).connect(AC.destination); src.start();
}
const bgm = new Audio("bgm.mp3"); bgm.loop = true; bgm.volume = .45; bgm.preload = "none";
let gameOn = false;
function bgmApply() { if (S.bgm && gameOn && !document.hidden) { bgm.play().catch(() => {}); } else bgm.pause(); }
document.addEventListener("visibilitychange", bgmApply);
